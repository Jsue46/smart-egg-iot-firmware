# SmartEgg - configuracion base de Mosquitto 2.x
#
# El compose de Rol 2 debe montar este archivo en:
# /mosquitto/config/mosquitto.conf

# MQTT nativo para backend, Grafana y herramientas de prueba.
listener 1883 0.0.0.0
protocol mqtt

# WebSocket para el frontend mediante MQTT.js.
listener 9001 0.0.0.0
protocol websockets

# Solo para la demostracion local dentro de la red Docker del proyecto.
# Para un despliegue expuesto, Rol 2 debe sustituirlo por password_file + ACL.
allow_anonymous true

# Persistencia del estado retained y de la sesion del broker.
persistence true
persistence_location /mosquitto/data/
autosave_interval 30
autosave_on_changes true

# Logs visibles desde `docker compose logs mosquitto`.
connection_messages true
log_type all
log_dest stdout
